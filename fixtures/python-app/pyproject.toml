[project]
name = "openclion-fixture-tasks"
version = "0.1.0"
description = "OpenCLion QA fixture: a tiny task tracker"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tasks = "tasks.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
