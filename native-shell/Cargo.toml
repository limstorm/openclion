[package]
name = "openclion-native"
version = "0.1.33"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-base = { version = "0.6.0", default-features = false, features = ["editor", "highlight"] }
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "svg"] }
gtk4 = { version = "0.11", features = ["v4_14"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "svg"] }

[dev-dependencies]
nsh-engine = "0.6.0"
nsh-testing = "0.6.0"
