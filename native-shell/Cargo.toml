[package]
name = "openclion-native"
version = "0.1.33"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-base = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "term"] }
env_logger = "0.11"
ide-core = { path = "../crates/ide-core" }
ide-cmake = { path = "../crates/ide-cmake" }
ide-vcs = { path = "../crates/ide-vcs" }
ide-search = { path = "../crates/ide-search" }
ide-lsp = { path = "../crates/ide-lsp" }
ide-language = { path = "../crates/ide-language" }
ide-text = { path = "../crates/ide-text" }
ide-terminal = { path = "../crates/ide-terminal" }
ide-dap = { path = "../crates/ide-dap" }
tokio = { version = "1", features = ["sync"] }
notify = "8"
notify-debouncer-full = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "svg", "term"] }
gtk4 = { version = "0.11", features = ["v4_14"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "svg", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["editor", "highlight", "svg", "term"] }

[dev-dependencies]
nsh-engine = "0.6.0"
nsh-testing = "0.6.0"
