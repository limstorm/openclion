id = "ruby"
name = "Ruby"
extensions = ["rb", "rake", "gemspec", "ru", "rbi", "jbuilder", "podspec"]
filenames = ["Gemfile", "Rakefile", "Podfile", "Vagrantfile", "Brewfile", "Guardfile", "Fastfile", "Appfile", "Capfile", "Dangerfile", "Steepfile", ".irbrc", ".pryrc"]
first-line = "^#!.*\\bruby\\b"
line-comment = "#"
block-comment = ["=begin", "=end"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "Ruby"
tree-sitter = "ruby"
